version: 2

models:
  - name: groupping
    description: "groupping"
    columns:
      - name: date
        description: "groupping"
        data_tests:
          - not_null

  - name: dim_product
    description: "Наименования продукции"
    columns:
      - name: product
        description: "Бытовые приборы"
        data_tests:
          - not_null
      - name: price
        description: "Цена за единицу"
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "id заказа"
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: "id клиента"
        data_tests:
          - not_null
          - unique
      - name: quantity
        description: "количество в заказе"
        data_tests:
          - not_null
          - unique
